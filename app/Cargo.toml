[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5.1"
env_logger = "0.11.3"
dotenv = "0.15.0"
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
httpstatus = "=0.1.2"
sea-orm = { version = "1.1.7", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }