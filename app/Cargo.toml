[package]
name = "accounting"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
  ".",
  "entity",
  "migration",
]

[dependencies]
actix-web = "4.5.1"
env_logger = "0.11.3"
dotenv = "0.15.0"
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.20.0", features = ["derive"] }
httpstatus = "=0.1.2"
sea-orm = { version = "1.1.7", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
entity = { path = "entity" }
migration = { path = "migration" }
uuid = { version = "1.11.0", features = ["v4"] }
sha256 = "1.6.0"
chrono = "0.4.40"
jsonwebtoken = "9.3.1"