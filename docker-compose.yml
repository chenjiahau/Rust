services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: accounting-db
    env_file:
      - "./db.env"
    ports:
      - "5433:5432"
    restart: always
    networks:
      - shared-network
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: accounting-api
    env_file:
      - ./server/.env
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - shared-network

volumes:
  postgres_data:

networks:
  shared-network:
    external: true